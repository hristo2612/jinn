<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0px, so the --safe-* tokens in globals.css only do their
         job with it present. Required by the native shell and correct for the
         installed PWA on a notched device. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="description" content="AI Gateway Dashboard" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jinn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Dark --bg, matching the manifest and the theme the bootstrap below
         falls back to. ThemeProvider rewrites this from the live --bg token on
         mount, so an explicitly light install gets a light titlebar. -->
    <meta name="theme-color" content="#14130F" />
    <title>Jinn - AI Gateway</title>
    <script>if(typeof crypto!=='undefined'&&!crypto.randomUUID){crypto.randomUUID=function(){return'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,function(c){var r=crypto.getRandomValues(new Uint8Array(1))[0];return(c^(r&(15>>(c/4)))).toString(16)})}}</script>
    <!-- Blocking on purpose: the theme and the Text size step both decide how the
         first paint looks, so reading them from a React effect would render the
         app once at the default and reflow. The step list mirrors TEXT_SCALES in
         src/lib/settings.ts, which an inline script cannot import; anything else
         stored falls through to the unscaled default in globals.css. -->
    <script>(function(){try{var t=localStorage.getItem('jinn-theme')||'dark';if(t==='system'){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t);var s=JSON.parse(localStorage.getItem('jinn-settings')||'{}').textScale;if([0.9,1,1.1,1.25].indexOf(s)>=0){document.documentElement.style.setProperty('--text-scale',s)}}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
